"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
archive = ".conductor/scripts/archive-guard.zsh"
setup = ".conductor/scripts/sync-from-github.zsh"
run = "open index.html"

[git]
archive_on_merge = true
branch_prefix_type = "github_username"
delete_branch_on_archive = true
worktree_push_auto_setup_remote = true

[prompts]
general = """
GitHub source-of-truth policy:
- Treat origin's default branch on GitHub as canonical. Fetch origin before editing and reconcile the task branch with the latest origin default branch.
- Work on a unique feature branch. Do not push directly to main or master unless Alex explicitly requests it.
- Never leave completed work only on a Mac or only on a divergent branch. Commit task-owned changes, push the exact feature-branch HEAD to origin, and enqueue its pull request with `conductor-land`.
- `conductor-land` returns `QUEUED` after GitHub owns the exact branch SHA. This is successful asynchronous handoff, so report the pull request URL and end the chat without waiting for CI or deployment unless Alex explicitly requests synchronous waiting.
- The repository's Conductor worker serializes queued pull requests, merges the newest default branch into each one, reruns required checks on the combined state, enables squash auto-merge, and advances the next item. Never run a competing local merge loop.
- Do not claim `MERGED` or `LANDED` unless GitHub actually reports the pull request merged and the remote default branch contains its merge commit. Use `conductor-land --wait` only when synchronous verification was explicitly requested.
- Preserve unrelated work. Never reset, stash, delete, overwrite, or force-push work owned by another person or workspace.
- If background landing later finds a conflict, failed required check, permission problem, trusted-workflow change, or unapproved production release, it labels the pull request `conductor-blocked` and leaves a single explanatory comment. Resolve that pull request and rerun `conductor-land`; never silently discard it.
- Explicit read-only, draft, review-only, or no-merge requests override automatic landing.
- After tests pass, use the PATH-level `conductor-land` command so every chat uses the current global implementation.

Frontend and UI design policy:
- Claude Fable 5 (`claude-fable-5`) is the sole design authority for outward-facing frontend and UI work.
- Fable must author or explicitly review layout, hierarchy, navigation, components, typography, color, spacing, responsive behavior, interactions, and UI states before shipment.
- Codex and non-Fable models may preserve behavior, implement Fable's specification, refactor, test, secure, and deploy, but must not invent outward-facing visual direction.
- Never sacrifice functionality, permissions, security, or legal invariants for visual cleanup, and never ship no-op controls as if they work.
"""

create_pr = """
Fetch origin before editing and preserve both sides of overlapping changes. After relevant local tests pass, run the PATH-level `conductor-land` command. It must push and verify the exact HEAD, create or update a same-repository pull request, and enqueue it for the repository's serialized background worker. A `QUEUED` result is the intended asynchronous handoff; report the pull request URL without waiting. Use `conductor-land --wait` only if Alex explicitly requests synchronous merge verification. Do not claim `MERGED` or `LANDED` until GitHub confirms it.
"""

resolve_merge_conflicts = """
Resolve conflicts semantically. Inspect the merge base, the feature-branch diff, and the newest default-branch diff. Preserve compatible intent from both Alex and Lucas. Never resolve an entire file or tree wholesale with ours or theirs. After resolving, rerun the relevant tests before pushing or merging.
"""
